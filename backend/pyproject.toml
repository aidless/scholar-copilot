[project]
name = "scholar-copilot-backend"
version = "1.7.0"
description = "开源学术写作 Copilot 后端（FastAPI + PostgreSQL + arq）"
requires-python = ">=3.11"
dependencies = [
    # 上界钉住：契约文件由 FastAPI 导出的 OpenAPI 决定，上游大版本改了 schema 形状
    # 会让 openapi.yaml 漂移（CI 的一致性门会红）。升级需同时重新导出并复核。
    "fastapi>=0.115,<0.163",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "aiosqlite>=0.20",
    "pydantic-settings>=2.0",
    "httpx>=0.27",
    "arq>=0.26",
    "bcrypt>=4.1",
    "pyjwt>=2.9",
    "python-docx>=1.1",
    "alembic>=1.13",
    "python-pptx>=1.0",
    "redis>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "fakeredis>=2.20"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
