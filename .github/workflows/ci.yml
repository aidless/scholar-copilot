name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: backend tests (py3.12)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install LibreOffice + TeX（PDF/LaTeX 导出用例依赖）
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libreoffice-writer fonts-noto-cjk \
            texlive-xetex texlive-lang-chinese texlive-latex-recommended
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]" pytest httpx
      - name: Alembic 迁移可在空库落地
        env:
          SC_DATABASE_URL: sqlite+aiosqlite:///./ci-alembic.db
        run: alembic upgrade head
      - name: OpenAPI 契约与代码一致
        env:
          SC_DATABASE_URL: sqlite+aiosqlite:///./ci-openapi.db
          SC_JWT_SECRET: ci-secret
          SC_DB_AUTO_CREATE: "true"
        run: python -m scripts.export_openapi --check
      - name: Tests
        run: python -m pytest tests/ -q
      # 「clone 即跑」的门：一键演示脚本必须真能跑通全流程并产出带披露表/水印的 docx。
      # 用 PYTHON 指定当前解释器（脚本默认 python3，CI 里那是 setup-python 的同一个）。
      - name: 一键演示脚本冒烟（下单→大纲→逐章→支付→导出）
        env:
          PYTHON: python
          DEMO_OUT_DIR: ${{ runner.temp }}/sc-demo
        run: bash ../scripts/demo_local.sh

  frontend:
    name: frontend build (node20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Typecheck + Build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_API_BASE: http://localhost:8000
        run: npm run build
      - name: Install Playwright browser (chromium)
        run: npx playwright install --with-deps chromium
      - name: E2E 关键路径 (Playwright)
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          CI: "true"
        run: npx playwright test
