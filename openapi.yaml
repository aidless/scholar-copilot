        in: query
        required: false
        schema:
          type: string
          default: ''
          title: Timestamp
      - name: nonce
        in: query
        required: false
        schema:
          type: string
          default: ''
          title: Nonce
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - BearerAuth: []
  /auth/wechat/complete:
    post:
      tags:
      - auth
      summary: Wechat Complete
      description: '扫码后完成登录：用 openid 找到/创建用户并确认会话（真实网关下前端调用）。


        dev 模式亦可用来模拟真实回调后的绑定（与 mock-approve 的区别：这条走 openid）。'
