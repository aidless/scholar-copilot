openapi: 3.1.0
info:
  title: Scholar Copilot API
  version: 1.10.0
  description: 'Scholar Copilot 后端契约（由 FastAPI 从代码导出，勿手改）。


    鉴权：Bearer JWT（`Authorization: Bearer <token>`）。管理端与分销端各自独立 token。

    资源隔离：所有用户资源查询强制 tenant+owner 过滤；属主不符统一 404（不泄露存在性）。

    计费配额：价格与配额全部服务端判定；配额不足 402；未支付生成正文 402。

    限流：登录 20/min、LLM 类 10/min、检索 30/min，超限 429 + `Retry-After`。

    任务：生成类端点默认 202 返回 `{job_id,status}`，用 `GET /jobs/{id}` 轮询或

    `WS /jobs/{id}/ws?token=` 订阅进度。

    '
paths:
  /auth/register:
    post:
      tags:
      - auth
      summary: Register
      operationId: register_auth_register_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterIn'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /auth/login:
    post:
      tags:
      - auth
      summary: Login
      operationId: login_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginIn'
        required: true
      responses:
        '200':
