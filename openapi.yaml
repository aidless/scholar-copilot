# Scholar Copilot API 契约 v0.1（骨架）

> 与原产品（blsxueshu 逆向还原的 90+ 端点）的对应关系标注在各端点 `x-origin`。
> 设计差异：**标准 REST + HTTP 状态码**，不用 {code:9999} 黑盒业务码；错误体统一 `{detail}`。

info:
  title: Scholar Copilot API
  version: 0.1.0
  description: |
    鉴权：Bearer JWT。所有用户资源查询强制 tenant+owner 过滤（服务端实现，见 app/tenancy.py）。
    计费与配额全部服务端判定；配额不足返回 402，属主不符返回 404（不泄露存在性）。

paths:
  /health:
    get:
      summary: 健康检查
      responses: { "200": { description: ok } }

  /auth/register: { post: { summary: 注册（短信验证码），返回 JWT, x-origin: websiteUser/addUserByPhone, responses: { "200": { description: TokenOut }, "501": { description: 骨架未实现 } } } }
  /auth/login: { post: { summary: 手机号+密码登录, x-origin: websiteUser/login, responses: { "200": { description: TokenOut }, "401": { description: 凭证错误 } } } }
  /auth/me: { get: { summary: 当前用户（含配额余额）, responses: { "200": { description: UserInfo } } } }

  /billing/quote:
    get:
      summary: 价格试算（公式透明，前后端同公式）
      parameters:
        - { name: education, in: query, required: true, schema: { type: string, enum: [本科, 硕士, 博士] } }
        - { name: word_count, in: query, required: true, schema: { type: integer } }
      responses: { "200": { description: "{price_cents, currency}" } }
      x-origin: aiWriting/saveOrder 的服务端算价部分

  /billing/quota:
    get: { summary: 当前用户各品类配额余额（quota_ledger SUM）, x-origin: aiWriting/freeOutlineNumber }

  /writing/orders:
    post:
      summary: 创建写作订单（价格服务端算，前端传价格字段无效）
      requestBody: { content: { application/json: { schema: { $ref: "#/components/schemas/OrderIn" } } } }
      responses: { "200": { description: OrderOut }, "402": { description: 配额/余额不足 } }
      x-origin: aiWriting/saveOrder
    get:
      summary: 我的订单列表（强制属主过滤）
      responses: { "200": { description: "OrderOut[]" } }
      x-origin: aiWriting/query

  /writing/orders/{order_id}:
    get:
      summary: 订单详情
      parameters: [{ name: order_id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: OrderOut }, "404": { description: 不存在或不属当前用户（统一 404，防枚举） } }
      x-origin: aiWriting/orderInfo —— 原 IDOR 漏洞点，此处 404 即修复
    delete: { summary: 删除草稿单, x-origin: aiWriting/delOrder }

  /writing/orders/{order_id}/outline:
    post:
      summary: 生成大纲（异步，返回 job_id；免费配额服务端扣）
      responses: { "202": { description: "{job_id}" }, "402": { description: 免费次数用尽 } }
      x-origin: aiWriting/outline —— 原产品免费 3 次后 code:1008，此处 402

  /writing/orders/{order_id}/chapters/{idx}:
    post: { summary: 生成/改写单章（异步）, responses: { "202": { description: "{job_id}" } } }

  /writing/orders/{order_id}/export:
    post: { summary: 导出 DOCX（必带 AI 参与度标记页）, responses: { "200": { description: 文件流 } } }

  /jobs/{job_id}:
    get: { summary: 任务状态轮询（queued/running/done/failed + progress）, responses: { "200": { description: JobOut } } }

  /references/search:
    get: { summary: 文献检索（paperKB + OpenAlex/Crossref 交叉）, responses: { "200": { description: "ReferenceOut[]，每条带 verify_state" } } }
  /references/verify:
    post: { summary: 单条引用真实性核查, responses: { "200": { description: "{verify_state, evidence}" } } }

  /review/orders/{order_id}/audit:
    post: { summary: 全文核查（引用/数字/统计），产出报告, responses: { "202": { description: "{job_id}" } } }

  /payments:
    post: { summary: 创建支付单（微信 Native / 支付宝）, x-origin: pay/payment, responses: { "200": { description: "{serial_no, qr_url}" } } }
  /payments/{serial_no}:
    get: { summary: 支付状态轮询, x-origin: pay/queryPayStatus, responses: { "200": { description: "{status}" } } }

  /admin/*:
    get: { summary: 管理端全部接口（RBAC 强制，密钥字段永不出响应）, x-origin: /saas-writing/admin/* —— 原产品匿名可读区域, responses: { "401": { description: 未携带 admin JWT }, "403": { description: 角色不足 } } }

components:
  schemas:
    OrderIn:
      type: object
      required: [title, education, word_count]
      properties:
        title: { type: string }
        education: { type: string }
        word_count: { type: integer }
        language: { type: string, default: zh }
        writing_type: { type: string, default: thesis }
    OrderOut:
      type: object
      properties:
        id: { type: string, format: uuid }
        order_no: { type: string }
        title: { type: string }
        status: { type: string }
        price_cents: { type: integer }
