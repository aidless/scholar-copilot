services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: scholar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scholar}
      POSTGRES_DB: scholar
    volumes:
      - ./deploy/init.sql:/docker-entrypoint-initdb.d/init.sql
      - pgdata:/var/lib/postgresql/data
    ports: ["5432:5432"]
  redis:
    image: redis:7
    ports: ["6379:6379"]
  backend:
    build: ./backend
    env_file: .env
    depends_on: [postgres, redis]
    ports: ["8000:8000"]
    # Dockerfile 待 v0.2 补（骨架期直接 uvicorn 本地跑）
  frontend:
    build: ./frontend
    depends_on: [backend]
    ports: ["3000:3000"]
volumes:
  pgdata:
