services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: scholar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scholar}
      POSTGRES_DB: scholar
    volumes:
      - pgdata:/var/lib/postgresql/data
      # 建表由 backend 容器启动时跑 alembic upgrade head 完成（单一 schema 真相源）；
      # deploy/init.sql 保留为设计蓝本（含 R1-R4 约束注释），不再作为 entrypoint 脚本执行。
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scholar -d scholar"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  backend:
    build: ./backend
    # 迁移先于服务：容器内 alembic upgrade head 幂等，避免 create_all 与迁移双真相源
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    env_file:
      - path: .env
        required: false
    environment:
      SC_DATABASE_URL: postgresql+asyncpg://scholar:${POSTGRES_PASSWORD:-scholar}@postgres:5432/scholar
      SC_REDIS_URL: redis://redis:6379/0
      SC_DB_AUTO_CREATE: "false"  # 表由上面的 alembic upgrade head 建，不靠 create_all
      SC_TASK_QUEUE: arq          # 生成任务交 worker 容器（也可改回 inline 单进程演示）
      # 多容器共享同一 Redis，限流必须走 Redis 计数，否则配额 = 配置值 × 容器数
      SC_RATE_LIMIT_BACKEND: redis
      SC_PRIMARY_DOMAIN: localhost:3000
      SC_CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports: ["8000:8000"]
  worker:
    build: ./backend
    command: ["python", "-m", "arq", "app.tasks.worker.WorkerSettings"]
    env_file:
      - path: .env
        required: false
    environment:
      SC_DATABASE_URL: postgresql+asyncpg://scholar:${POSTGRES_PASSWORD:-scholar}@postgres:5432/scholar
      SC_REDIS_URL: redis://redis:6379/0
      SC_TASK_QUEUE: arq          # 与 backend 共享队列，生成任务交独立 worker 进程
      SC_DB_AUTO_CREATE: "false"  # 表由 backend 启动时创建，worker 只消费
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE: http://localhost:8000
    environment:
      NEXT_PUBLIC_API_BASE: http://localhost:8000
    depends_on: [backend]
    ports: ["3000:3000"]
volumes:
  pgdata:
